<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesFlow CRM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.98);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            color: #999;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            margin-top: 0;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .deals-list, .activities-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .deal-item, .activity-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .deal-item h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .deal-item p {
            color: #999;
            font-size: 12px;
        }

        .btn-delete {
            background: #ff6b6b;
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .logout-btn {
            background: #ff6b6b;
            margin-top: 20px;
        }

        .user-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .user-info p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginScreen" class="screen">
            <div class="header">
                <h1>📊 SalesFlow</h1>
                <p>Sales Pipeline Management</p>
            </div>

            <div class="error" id="loginError"></div>
            <div class="success" id="loginSuccess"></div>

            <div id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password">
                </div>
                <button onclick="login()">Login</button>
                <button onclick="showRegister()" style="background: #999; margin-top: 10px;">Create New Account</button>
            </div>

            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="registerUsername" placeholder="Create username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword" placeholder="Create password">
                </div>
                <button onclick="register()">Sign Up</button>
                <button onclick="showLogin()" style="background: #999; margin-top: 10px;">Back to Login</button>
            </div>
        </div>

        <div id="appScreen" class="screen" style="display: none;">
            <div class="user-info">
                <p>Welcome, <strong id="username"></strong>!</p>
                <p id="email"></p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
                <button class="tab-btn" onclick="switchTab('deals')">Deals</button>
                <button class="tab-btn" onclick="switchTab('activities')">Activities</button>
            </div>

            <div class="error" id="appError"></div>
            <div class="success" id="appSuccess"></div>

            <!-- Dashboard Tab -->
            <div id="dashboard" class="tab-content active">
                <div class="stats">
                    <div class="stat-card">
                        <h3 id="totalDeals">0</h3>
                        <p>Total Deals</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="totalValue">$0</h3>
                        <p>Total Value</p>
                    </div>
                </div>
            </div>

            <!-- Deals Tab -->
            <div id="deals" class="tab-content">
                <h3 style="margin-bottom: 15px; color: #333;">Add New Deal</h3>
                <div class="form-group">
                    <label>Deal Title</label>
                    <input type="text" id="dealTitle" placeholder="e.g., Enterprise Contract">
                </div>
                <div class="form-group">
                    <label>Stage</label>
                    <select id="dealStage">
                        <option>Lead</option>
                        <option>Prospect</option>
                        <option>Negotiation</option>
                        <option>Closing</option>
                        <option>Won</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Deal Value</label>
                    <input type="number" id="dealValue" placeholder="0" min="0">
                </div>
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="customerName" placeholder="e.g., Acme Corp">
                </div>
                <button onclick="createDeal()">Add Deal</button>

                <h3 style="margin: 20px 0 15px; color: #333;">Your Deals</h3>
                <div class="deals-list" id="dealsList"></div>
            </div>

            <!-- Activities Tab -->
            <div id="activities" class="tab-content">
                <h3 style="margin-bottom: 15px; color: #333;">Log Activity</h3>
                <div class="form-group">
                    <label>Deal ID</label>
                    <input type="number" id="activityDealId" placeholder="Enter deal ID" min="1">
                </div>
                <div class="form-group">
                    <label>Activity Type</label>
                    <select id="activityType">
                        <option>Call</option>
                        <option>Email</option>
                        <option>Meeting</option>
                        <option>Note</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="activityDescription" placeholder="What happened?" rows="3"></textarea>
                </div>
                <button onclick="logActivity()">Log Activity</button>

                <h3 style="margin: 20px 0 15px; color: #333;">Recent Activities</h3>
                <div class="activities-list" id="activitiesList"></div>
            </div>

            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let token = null;
        const API_BASE = 'http://localhost:3000/api'; // Change this to your Glitch/deployed URL

        // Show/Hide Screens
        function showLoginScreen() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('appScreen').style.display = 'none';
        }

        function showAppScreen() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            loadDashboard();
        }

        // Auth Functions
        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }

        async function register() {
            const email = document.getElementById('registerEmail').value;
            const username = document.getElementById('registerUsername').value;
            const password = document.getElementById('registerPassword').value;

            if (!email || !username || !password) {
                showError('loginError', 'All fields required');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username, password })
                });

                if (res.ok) {
                    showSuccess('loginSuccess', 'Account created! Now login.');
                    setTimeout(() => showLogin(), 1500);
                } else {
                    const err = await res.json();
                    showError('loginError', err.error);
                }
            } catch (e) {
                showError('loginError', 'Connection error. Check API URL.');
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('loginError', 'Username and password required');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const data = await res.json();
                    token = data.token;
                    currentUser = data.user;
                    document.getElementById('username').textContent = currentUser.username;
                    document.getElementById('email').textContent = currentUser.email;
                    showAppScreen();
                } else {
                    showError('loginError', 'Invalid credentials');
                }
            } catch (e) {
                showError('loginError', 'Connection error. Is the server running?');
            }
        }

        function logout() {
            currentUser = null;
            token = null;
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            showLoginScreen();
        }

        // Deals
        async function createDeal() {
            const title = document.getElementById('dealTitle').value;
            const stage = document.getElementById('dealStage').value;
            const value = document.getElementById('dealValue').value;
            const customer_name = document.getElementById('customerName').value;

            if (!title) {
                showError('appError', 'Deal title required');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/deals`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, stage, value, customer_name })
                });

                if (res.ok) {
                    showSuccess('appSuccess', 'Deal created!');
                    document.getElementById('dealTitle').value = '';
                    document.getElementById('dealValue').value = '';
                    document.getElementById('customerName').value = '';
                    loadDeals();
                } else {
                    showError('appError', 'Failed to create deal');
                }
            } catch (e) {
                showError('appError', 'Error: ' + e.message);
            }
        }

        async function loadDeals() {
            try {
                const res = await fetch(`${API_BASE}/deals`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const deals = await res.json();
                    let html = '';
                    deals.forEach(deal => {
                        html += `
                            <div class="deal-item">
                                <div>
                                    <h3>${deal.title}</h3>
                                    <p>${deal.customer_name} • $${deal.value} • ${deal.stage}</p>
                                </div>
                                <button class="btn-delete" onclick="deleteDeal(${deal.id})">Delete</button>
                            </div>
                        `;
                    });
                    document.getElementById('dealsList').innerHTML = html || '<p style="color:#999;">No deals yet</p>';
                }
            } catch (e) {
                console.error('Error loading deals:', e);
            }
        }

        async function deleteDeal(id) {
            try {
                const res = await fetch(`${API_BASE}/deals/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    showSuccess('appSuccess', 'Deal deleted!');
                    loadDeals();
                }
            } catch (e) {
                showError('appError', 'Error deleting deal');
            }
        }

        // Activities
        async function logActivity() {
            const deal_id = document.getElementById('activityDealId').value;
            const type = document.getElementById('activityType').value;
            const description = document.getElementById('activityDescription').value;

            if (!deal_id || !description) {
                showError('appError', 'All fields required');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/activities`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ deal_id, type, description })
                });

                if (res.ok) {
                    showSuccess('appSuccess', 'Activity logged!');
                    document.getElementById('activityDealId').value = '';
                    document.getElementById('activityDescription').value = '';
                    loadActivities();
                }
            } catch (e) {
                showError('appError', 'Error: ' + e.message);
            }
        }

        async function loadActivities() {
            try {
                const res = await fetch(`${API_BASE}/activities/1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const activities = await res.json();
                    let html = '';
                    activities.forEach(act => {
                        html += `
                            <div class="activity-item">
                                <div>
                                    <h3>${act.type.toUpperCase()}</h3>
                                    <p>${act.description}</p>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('activitiesList').innerHTML = html || '<p style="color:#999;">No activities yet</p>';
                }
            } catch (e) {
                console.error('Error loading activities:', e);
            }
        }

        // Dashboard
        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE}/deals`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const deals = await res.json();
                    const totalValue = deals.reduce((sum, deal) => sum + (deal.value || 0), 0);
                    document.getElementById('totalDeals').textContent = deals.length;
                    document.getElementById('totalValue').textContent = '$' + totalValue.toLocaleString();
                }
            } catch (e) {
                console.error('Error loading dashboard:', e);
            }
        }

        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'deals') loadDeals();
            if (tab === 'activities') loadActivities();
            if (tab === 'dashboard') loadDashboard();
        }

        // Helpers
        function showError(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function showSuccess(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        // Check if logged in
        window.addEventListener('load', () => {
            if (!token) showLoginScreen();
        });
    </script>
</body>
</html>
